<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tara's Carousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="browser-shell">
      <header class="browser-topbar">
        <div class="traffic">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <nav class="crumbs">
          <span>Safari</span>
          <span>Arkiv</span>
          <span>Rediger</span>
          <span>Visning</span>
          <span>Historik</span>
          <span>Bogmærker</span>
        </nav>

        <div class="top-actions">
          <span>Vindue</span>
          <span>Hjælp</span>
          <span>◁</span>
          <span>◧</span>
          <span>◉</span>
          <span>10.10</span>
        </div>
      </header>

      <div class="toolbar">
        <div class="left-tools">
          <button>◁</button>
          <button>▷</button>
          <button>⟲</button>
        </div>

        <div class="address-bar">
          <span class="lock">◌</span>
          <span>tarapejanovic.com</span>
        </div>

        <div class="right-tools">
          <span>⟲</span>
          <span>+</span>
          <span>▣</span>
        </div>
      </div>

      <div class="content-shell">
        <aside class="sidebar">
          <div class="menu-label">MENU</div>
          <ul class="menu-list">
            <li><button class="active">START</button></li>
            <li><button>ABOUT</button></li>
            <li><button>WORK</button></li>
            <li class="nested"><button>— FILM</button></li>
            <li class="nested"><button>— OUTPUT FESTIVAL</button></li>
            <li class="nested"><button>— PHOTOGRAPHY</button></li>
            <li><button>CONTACT</button></li>
          </ul>
          <button class="close-x">×</button>
        </aside>

        <main class="room-canvas">
          <div class="draw-frame">
            <div class="projected-screen">
              <div class="screen-inner">
                <span class="menu-word">Menu</span>
                <h1>TARA'S CAROUSEL</h1>
                <div class="screen-tag">TARA PEJANOVIC / FILM · PHOTOGRAPHY · VISUAL STORYTELLING</div>
              </div>
            </div>

            <div class="projector-outline">
              <div class="projector-body"></div>
              <div class="machine-base"></div>
            </div>
          </div>
        </main>
      </div>

      <footer class="dock">
        <span class="app launch">📁</span>
        <span class="app">💬</span>
        <span class="app">📷</span>
        <span class="app">🧭</span>
        <span class="app">📦</span>
        <span class="app">☁</span>
        <span class="app">💻</span>
        <span class="app">🎵</span>
        <span class="app">📚</span>
        <span class="app">📐</span>
        <span class="app">🧪</span>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
