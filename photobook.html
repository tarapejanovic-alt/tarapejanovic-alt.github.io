<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobook</title>
<style>
  :root { --bg:#f2f2f0; --fg:#1a1a1a; --muted:#666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#999; } }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:Georgia, "Times New Roman", serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-weight:normal; font-size:1.4rem; margin:0 0 16px; }
  #book { margin:0 auto; }
  .controls { display:flex; gap:12px; justify-content:center; align-items:center; margin-top:16px; color:var(--muted); font-size:.95rem; }
  .controls button { font:inherit; padding:8px 16px; border:1px solid var(--muted); background:transparent; color:var(--fg); border-radius:4px; cursor:pointer; }
  .controls button:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  .page img { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<main>
  <h1>Photobook</h1>
  <div id="book"></div>
  <div class="controls">
    <button id="prev" type="button">Previous</button>
    <span id="count">1 / 28</span>
    <button id="next" type="button">Next</button>
  </div>
  <noscript><p>This photobook needs JavaScript. <a href="photobook-single-pages.pdf">Download it as a PDF</a> instead.</p></noscript>
  <p class="controls"><a href="photobook-single-pages.pdf" style="color:inherit">Download as PDF</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  const TOTAL = 28;
  const pages = Array.from({length: TOTAL}, (_, i) =>
    'pages/page-' + String(i + 1).padStart(2, '0') + '.jpg');

  const book = new St.PageFlip(document.getElementById('book'), {
    width: 600, height: 849,
    size: 'stretch',
    minWidth: 280, maxWidth: 600,
    minHeight: 396, maxHeight: 849,
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.4,
    mobileScrollSupport: false
  });
  book.loadFromImages(pages);

  const count = document.getElementById('count');
  book.on('flip', e => { count.textContent = (e.data + 1) + ' / ' + TOTAL; });
  document.getElementById('prev').onclick = () => book.flipPrev();
  document.getElementById('next').onclick = () => book.flipNext();
</script>
</body>
</html>
